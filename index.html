function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();openRecipe(id)}function doneCooking(id){closeModal();notify('完成！记得在冰箱里更新剩余数量')}
function swap(m){state.today[m]=choose(m,[state.today[m]]);save();renderHome()}function regenerateToday(){let used=[];for(let m of ['早餐','午餐','晚餐']){let id=choose(m,[state.today[m],...used]);state.today[m]=id;used.push(id)}save();renderHome()}
function generateWeek(){let used=[];state.week=Array.from({length:7},()=>{let obj={};for(let m of ['早餐','午餐','晚餐']){let pool=REC.filter(r=>r.meal===m&&!state.hiddenRecipes.includes(r.id)).sort((a,b)=>{let aScore=missing(a).length*10+(used.includes(a.id)?12:0)+a.time/100;let bScore=missing(b).length*10+(used.includes(b.id)?12:0)+b.time/100;return aScore-bScore});obj[m]=pool[0].id;used.push(pool[0].id)}return obj});save();renderWeek();notify('已生成一周菜单')}
function renderWeek(){let days=['周一','周二','周三','周四','周五','周六','周日'];let missingItems=[...new Set(state.week.flatMap(d=>Object.values(d).flatMap(id=>missing(REC[id]))))];$('week').innerHTML=`<div class="card"><div class="flex"><h2>一周三餐计划</h2><span class="pill">7天 · 21餐</span></div><p class="sub">优先使用冰箱食材，并尽量减少重复。</p><button class="btn full" style="margin:15px 0" onclick="generateWeek()">🎲 ${state.week.length?'重新生成一周':'生成我的一周菜单'}</button>${state.week.map((d,i)=>`<div class="day"><strong>${days[i]}</strong><span>${['早餐','午餐','晚餐'].map(m=>`${m}：${esc(REC[d[m]].name)}（${nutritionFor(REC[d[m]]).kcal} kcal）`).join('<br>')}<br><span class="cal">三餐合计约 ${dailyNutrition(Object.values(d)).kcal} kcal · 蛋白质 ${Math.round(dailyNutrition(Object.values(d)).protein)}g</span></span></div>`).join('')||'<div class="empty">点击上方按钮，一键生成七天三餐。</div>'}</div>${state.week.length?`<div class="card"><div class="flex"><h2>采购提醒</h2><button class="btn secondary small" onclick="copyShopping()">复制清单</button></div><p class="sub">计划中需要但冰箱里暂时没有的食材（不含数量）</p>${missingItems.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${missingItems.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:'<p>现有食材已覆盖这份计划！</p>'}</div>`:''}`}
function copyShopping(){let items=[...new Set(state.week.flatMap(d=>Object.values(d).flatMap(id=>missing(REC[id]))))];let t=items.join('\n')||'无需补充食材';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>notify('已复制采购清单')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove();notify('已复制采购清单')}

function editCustom(id){const r=id===undefined?null:REC[id];const portions=r?{...recipePortions[id]}:{'鸡蛋':60,'青菜':150,'食用油':5};$('modal').innerHTML=`<div class="modal" onclick="closeModal(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="flex"><h2>${r?'编辑':'新增'}自定义菜谱</h2><button class="btn ghost small" onclick="closeModal()">关闭 ✕</button></div><label class="label">菜名</label><input class="field" id="customName" maxlength="60" value="${esc(r?.name||'') }" placeholder="例如：香煎鸡胸肉"><label class="label">餐别</label><select class="field" id="customMeal">${['早餐','午餐','晚餐'].map(m=>`<option ${r?.meal===m?'selected':''}>${m}</option>`).join('')}</select><label class="label">时间（分钟）</label><input class="field" id="customTime" type="number" min="1" max="300" value="${r?.time||20}"><h2 style="margin-top:16px">所需食材与克数（单人份）</h2><div id="customIngredients"></div><button class="btn secondary small" onclick="addCustomIngredient()">＋ 添加食材</button><p class="tiny">未收录的食材可手动填写每100g的热量和蛋白质。估算值仅供参考。</p><label class="label">做法（每行一步）</label><textarea class="field" id="customSteps" rows="5">${esc((r?.steps||[]).join('\n'))}</textarea><button class="btn full" style="margin-top:16px" onclick="saveCustom(${id===undefined?'null':id})">保存菜谱</button></div></div>`;Object.entries(portions).forEach(([n,g])=>addCustomIngredient(n,g));}
function addCustomIngredient(n='',g=100){const row=document.createElement('div');row.className='formrow';row.style.margin='8px 0';row.style.display='flex';row.innerHTML=`<input class="field cname" placeholder="食材名称" value="${esc(n)}" style="min-width:0;flex:2"><input class="field cgram" type="number" min="1" max="3000" value="${g}" style="min-width:0;width:82px;flex:1" aria-label="克数"><button class="btn ghost small" onclick="this.parentElement.remove()">✕</button>`;$('customIngredients').appendChild(row)}
function saveCustom(id){const name=$('customName').value.trim(),meal=$('customMeal').value,time=Number($('customTime').value),steps=$('customSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);const portions={};for(const row of document.querySelectorAll('#customIngredients .formrow')){const n=row.querySelector('.cname').value.trim(),g=Number(row.querySelector('.cgram').value);if(!n||!Number.isFinite(g)||g<=0||g>3000){notify('请填写有效的食材名称和1-3000g重量');return}if(!foodNutrition[n]){const raw=prompt('未收录「'+n+'」。请输入每100g热量(kcal)和蛋白质(g)，用逗号分隔，例如 80,6');if(raw===null)return;const nums=raw.split(/[,，]/).map(Number);if(nums.length!==2||nums.some(v=>!Number.isFinite(v)||v<0)){notify('营养值格式不正确');return}foodNutrition[n]=nums;state.customFoodNutrition??={};state.customFoodNutrition[n]=nums;}portions[n]=g}if(!name||!Object.keys(portions).length||!Number.isInteger(time)||time<1||time>300){notify('请填写菜名、食材和有效制作时间');return}const need=Object.keys(portions).filter(x=>x!=='食用油');const obj={name,meal,time,icon:'🍽️',need,extra:[],steps:steps.length?steps:['按食材克数备料，烹饪至完全熟透。'],portions};if(id===null){state.customRecipes.push(obj);REC.push({...obj,id:REC.length,custom:true});recipePortions.push(portions)}else{if(!REC[id]?.custom){notify('只能编辑自己的菜谱');return}state.customRecipes[REC.slice(120,id).filter(x=>x.custom).length]=obj;REC[id]={...obj,id,custom:true};recipePortions[id]=portions}save();closeModal();renderRecipes();notify('菜谱已保存')}
function deleteCustom(id){if(!REC[id]?.custom||!confirm('确定删除这道自定义菜谱吗？'))return;const r=REC[id];const idx=REC.slice(120,id).filter(x=>x.custom).length;state.customRecipes.splice(idx,1);state.today={};state.week=[];state.favorites=state.favorites.filter(x=>x!==id).map(x=>x>id?x-1:x);state.hiddenRecipes=state.hiddenRecipes.filter(x=>x!==id).map(x=>x>id?x-1:x);state.portionOverrides=Object.fromEntries(Object.entries(state.portionOverrides).filter(([k])=>Number(k)!==id).map(([k,v])=>[Number(k)>id?Number(k)-1:k,v]));state.tutorialLinks=Object.fromEntries(Object.entries(state.tutorialLinks).filter(([k])=>Number(k)!==id).map(([k,v])=>[Number(k)>id?Number(k)-1:k,v]));REC.splice(id,1);recipePortions.splice(id,1);REC.forEach((x,i)=>x.id=i);save();closeModal();renderRecipes();notify('已删除菜谱')}

function closeModal(e){if(e&&e.target!==$('modal').firstChild)return;$('modal').innerHTML=''}function switchTab(t){active=t;for(let x of ['home','fridge','recipes','week'])$(x).classList.toggle('hide',x!==t);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));let headings={home:['今天吃什么？','用冰箱里已有的食材，做一顿喜欢的饭。'],fridge:['我的冰箱','有什么、还剩多少，一眼就知道。'],recipes:['厨房灵感','不用再纠结今天做什么。'],week:['一周不重样','提前安排好，工作日更轻松。']};$('heading').textContent=headings[t][0];$('subtitle').textContent=headings[t][1];render();window.scrollTo(0,0)}function render(){if(active==='home')renderHome();else if(active==='fridge')renderFridge();else if(active==='recipes')renderRecipes();else renderWeek()}document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>switchTab(x.dataset.tab)));try{render()}catch(err){document.getElementById('home').innerHTML='<div class="card"><h2>页面加载遇到问题</h2><p>请刷新页面重试。若仍有问题，请把错误信息发给我。</p><p id="load-error"></p></div>';document.getElementById('load-error').textContent=String(err);console.error(err)}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
